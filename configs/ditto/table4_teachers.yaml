# Ditto runs behind Table 4: one entry per training set and seed, as listed in results/table4_teachers.csv.
# Run with: python scripts/training/train_ditto.py --config configs/ditto/table4_teachers.yaml
# Add --benchmarks <entry>[,<entry>...] to run selected entries.
defaults:
  output_root: output/ditto_table4_teachers
  active_profiles: [all]
  model_name: roberta-base
  batch_size: 64
  max_len: 256
  epochs: 50
  lr: 5.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_accum_steps: 1
  early_stopping_patience: 10
  seed: 42
  num_workers: 2
  fp16: true
  da: del
