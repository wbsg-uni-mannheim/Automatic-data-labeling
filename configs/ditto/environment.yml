# Environment for Ditto, XGBoost, and the labeling workflows, with the versions used in the paper.
# environment.lock.yml lists every package of that environment (conda env export --no-builds).
name: ditto-modern
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - torchvision=0.19.1
  - torchaudio=2.4.1
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - pyyaml=6.*
  - tqdm=4.66.*
  - python-dotenv=1.*
  - faiss-cpu
  - nltk=3.9.*
  - spacy=3.7.6
  - regex
  - jsonlines
  - tensorboardx
  - pip:
      - transformers==4.41.2
      - tokenizers==0.19.1
      - sentencepiece==0.2.1
      - sentence-transformers==5.2.3
      - openai==2.32.0
      - xgboost==2.1.4
